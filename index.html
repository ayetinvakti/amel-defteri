    <script>
        // Tema, özel renk paleti ve dil (sayfa yüklenmeden önce çalışır, titremeyi önler)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isLight = savedTheme === 'light' || (!savedTheme && !systemPrefersDark);
            if (isLight) d.classList.add('light-mode');
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                    // Arapça / okunuş / meal renkleri de zemine göre okunabilir olsun (yazı rengi seçilmemişse)
                    d.style.setProperty('--arabic-text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--translation-color', bgIsLight ? '#334155' : '#e2e8f0');
                    d.style.setProperty('--transliteration-color', bgIsLight ? '#0369a1' : '#7dd3fc');
                }
            }
            // Safari üst/alt çubuğu sayfa zemin rengine uysun
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b || (isLight ? '#f8fafc' : '#0b1120'));

            // Dil ve yön
            const lang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('lang', lang);
            d.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>

const pad=n=>String(n).padStart(2,'0');

function toggle(id){
  const a=dayList(sel).slice(), k=a.indexOf(id);
  if(k>=0)a.splice(k,1);else a.push(id);
  if(a.length)S.days[sel]=a;else delete S.days[sel];
  const n=new Date(),cur=sel.slice(0,7)===n.getFullYear()+'-'+pad(n.getMonth()+1),b0=monthInfo(n.getFullYear(),n.getMonth());
  save();render();
  const b1=monthInfo(n.getFullYear(),n.getMonth());
  if(cur&&b1.c>b0.c){rain();if(b1.lv>b0.lv)setTimeout(burst,900);}
}
function shiftDay(n){const d=parse(sel);d.setDate(d.getDate()+n);if(ymd(d)>todayS())return;sel=ymd(d);render();}
function goToday(){sel=todayS();render();}
function addCustom(){
  const v=document.getElementById('addTxt').value.trim(); if(!v)return;
  S.cust.push({id:'c'+Date.now(),cat:document.getElementById('addCat').value,n:v.slice(0,60)});
  document.getElementById('addTxt').value='';save();render();
}
function delCustom(id){
  if(!confirm(t.delc))return;
  S.cust=S.cust.filter(c=>c.id!==id);
  Object.keys(S.days).forEach(d=>{const a=S.days[d].filter(x=>x!==id);if(a.length)S.days[d]=a;else delete S.days[d];});
  save();render();
}
function streak(){
  const d=new Date();let n=0;
  if(!dayList(ymd(d)).length)d.setDate(d.getDate()-1);
  while(dayList(ymd(d)).length){n++;d.setDate(d.getDate()-1);}
  return n;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const items=allItems(), ids=new Set(items.map(i=>i.id));
  const done=dayList(sel).filter(x=>ids.has(x));
  const pct=items.length?Math.round(done.length/items.length*100):0;
  const d=parse(sel);
  document.getElementById('dateTitle').textContent=(sel===todayS()?t.today+' • ':'')+d.toLocaleDateString(LG==='tr'?'tr-TR':LG==='ar'?'ar':'en-GB',{day:'numeric',month:'long',weekday:'long'});
  document.getElementById('pct').textContent='%'+pct;
  document.getElementById('barFill').style.width=pct+'%';
  document.getElementById('streak').textContent='🔥 '+t.streak.replace('{n}',streak());
  document.getElementById('nextB').disabled=sel>=todayS();
  // son 7 gün
  let w='';
  for(let i=6;i>=0;i--){
    const x=new Date();x.setDate(x.getDate()-i);const s=ymd(x),c=dayList(s).filter(q=>ids.has(q)).length;
    const wd=t.wk[(x.getDay()+6)%7];
    w+=`<div class="wd fin-btn${s===sel?' sel':''}${c?' has':''}" onclick="sel='${s}';render()">${wd}<b>${c}</b></div>`;
  }
  document.getElementById('week').innerHTML=w;
  // kategoriler
  let h='';
  CATS.forEach(cat=>{
    const li=items.filter(i=>i.cat===cat); if(!li.length)return;
    const dn=li.filter(i=>done.includes(i.id)).length;
    h+=`<div class="sec fin-card"><h2>${t.cats[cat]}<small>${t.done.replace('{a}',dn).replace('{b}',li.length)}</small></h2>`;
    li.forEach(i=>{
      const on=done.includes(i.id);
      h+=`<div style="display:flex;gap:4px;align-items:center"><button class="it fin-btn${on?' on':''}" onclick="toggle('${i.id}')"><span class="ck">${on?'✓':''}</span><span class="n">${esc(i.n)}</span></button>${i.c?`<button class="del" onclick="delCustom('${i.id}')" aria-label="✕">✕</button>`:''}</div>`;
    });
    h+='</div>';
  });
  document.getElementById('cats').innerHTML=h;
  renderTree();renderGarden();renderReport();
}

function applyText(){
  document.title=t.title;document.getElementById('h1').textContent=t.h1;

  }
  treeKey=key;treeLv=I.lv;
  document.getElementById('trTitle').textContent=T2.tree+' • '+T2.sp[SPS[m%6].k];
  document.getElementById('trPct').textContent='%'+I.p;
  document.getElementById('trChips').innerHTML=T2.lv.map((x,i)=>`<span class="ch${i+1===I.lv?' on':''}">${i+1}. ${x}</span>`).join('');
  const nxt=I.lv<5?Math.max(1,Math.ceil([25,50,75,100][I.lv-1]/100*I.t)-I.c):0;
  document.getElementById('trInfo').textContent=PREV?'🧪 Önizleme':T2.info.replace('{c}',I.c).replace('{t}',I.t)+' • '+(I.lv<5?T2.next.replace('{n}',nxt):T2.full);
}
function rain(){const s=document.querySelector('#treeSvg svg');if(!s)return;s.classList.remove('rain');void s.getBoundingClientRect();s.classList.add('rain');setTimeout(()=>s.classList.remove('rain'),3500);}
function burst(){
  const s=document.querySelector('#treeSvg svg');if(!s)return;const NS='http://www.w3.org/2000/svg',g=document.createElementNS(NS,'g');
  for(let i=0;i<18;i++){const c=document.createElementNS(NS,'circle'),a=i/18*6.283,d=70+Math.random()*70;
    c.setAttribute('cx',150);c.setAttribute('cy',190);c.setAttribute('r',3+Math.random()*3);c.setAttribute('fill',i%3?'#8bd36a':'#ffd86b');
    c.style.setProperty('--dx',(Math.cos(a)*d)+'px');c.style.setProperty('--dy',(Math.sin(a)*d-20)+'px');c.style.animation='bu 1.4s ease-out forwards';g.appendChild(c);}
  const rg=document.createElementNS(NS,'circle');rg.setAttribute('cx',150);rg.setAttribute('cy',190);rg.setAttribute('r',10);rg.setAttribute('fill','none');rg.setAttribute('stroke','#ffe9a0');rg.setAttribute('stroke-width',2);rg.style.transformBox='fill-box';rg.style.transformOrigin='center';rg.style.animation='ring 1.3s ease-out forwards';g.appendChild(rg);
  s.appendChild(g);setTimeout(()=>g.remove(),1500);
}
function renderGarden(){
  const n=new Date(),cy=n.getFullYear(),cm=n.getMonth(),keys=Object.keys(S.days).sort();let list=[];
  if(keys.length){const f=parse(keys[0]);let y=f.getFullYear(),m=f.getMonth();
    while(y<cy||(y===cy&&m<cm)){const I=monthInfo(y,m);if(I.c>0)list.push({y,m,I});m++;if(m>11){m=0;y++;}}}

}

// ===================== AYLIK RAPOR =====================
// Yalnızca kendi işaretlemelerinden hesaplanır; puan vermez, hüküm bildirmez.
const T3={
tr:{h:"📊 Aylık rapor",none:"Bu ay için işaretlenmiş amel yok.",total:"Toplam amel",days:"Amel yapılan gün",streak:"Ay içi en uzun seri",best:"En yoğun gün",goal:"Aylık hedefe oran",
daily:"Günlük dağılım",cats:"Kategoriler",top:"En çok işaretlediklerin",never:"Bu ay işaretlenmeyenler",prev:"Geçen ay",unit:"amel",d:"gün",
most:"En çok işaretlenen kategori: {x}",least:"En az işaretlenen kategori: {x}",live:"(ay devam ediyor)",all:"Hepsi en az bir kez işaretlendi."},
en:{h:"📊 Monthly report",none:"No deeds marked for this month.",total:"Total deeds",days:"Days with deeds",streak:"Longest streak this month",best:"Busiest day",goal:"Share of monthly goal",
daily:"Daily breakdown",cats:"Categories",top:"Your most marked",never:"Not marked this month",prev:"Last month",unit:"deeds",d:"days",
most:"Most marked category: {x}",least:"Least marked category: {x}",live:"(month in progress)",all:"Every deed was marked at least once."},
ar:{h:"📊 التقرير الشهري",none:"لا توجد أعمال مسجلة لهذا الشهر.",total:"مجموع الأعمال",days:"أيام فيها أعمال",streak:"أطول تتابع في الشهر",best:"أكثر الأيام عملًا",goal:"نسبة هدف الشهر",
daily:"التوزيع اليومي",cats:"الفئات",top:"الأكثر تسجيلًا",never:"لم تُسجَّل هذا الشهر",prev:"الشهر الماضي",unit:"عملًا",d:"أيام",
most:"أكثر فئة تسجيلًا: {x}",least:"أقل فئة تسجيلًا: {x}",live:"(الشهر جارٍ)",all:"سُجّل كل عمل مرة واحدة على الأقل."}}[LG];
let rOff=0; // 0 = bu ay, 1 = geçen ay ...
function rMax(){
  const k=Object.keys(S.days).sort(); if(!k.length)return 0;
  const f=parse(k[0]),n=new Date();return Math.max(0,(n.getFullYear()-f.getFullYear())*12+n.getMonth()-f.getMonth());
}
function rShift(n){const v=rOff+n;if(v<0||v>rMax())return;rOff=v;renderReport();}
function monthStats(y,m){
  const dim=new Date(y,m+1,0).getDate(),n=new Date(),cur=y===n.getFullYear()&&m===n.getMonth(),el=cur?n.getDate():dim;
  const items=allItems(),ids=new Set(items.map(i=>i.id)),cnt={},daily=[];
  let c=0,act=0,best=0,run=0,bestN=0,bestD=0;
  for(let d=1;d<=dim;d++){
    if(d>el){daily.push(null);continue;}
    const l=dayList(y+'-'+pad(m+1)+'-'+pad(d)).filter(q=>ids.has(q)),k=l.length;
    daily.push(k);c+=k;
    if(k){act++;run++;if(run>best)best=run;}else run=0;
    if(k>bestN){bestN=k;bestD=d;}
    l.forEach(q=>cnt[q]=(cnt[q]||0)+1);
  }
  return{y,m,dim,el,cur,items,cnt,daily,c,act,best,bestN,bestD};
}
function renderReport(){
  const box=document.getElementById('repBox');if(!box)return;
  const n=new Date(),dt=new Date(n.getFullYear(),n.getMonth()-rOff,1),y=dt.getFullYear(),m=dt.getMonth();
  const st=monthStats(y,m),mn=dt.toLocaleDateString(T2.loc,{month:'long',year:'numeric'});
  const head=`<div class="row"><h2 style="flex:1">${t_h()}</h2><span><button class="tb fin-btn" onclick="rShift(1)" ${rOff>=rMax()?'disabled':''}>‹</button> <button class="tb fin-btn" onclick="rShift(-1)" ${rOff<=0?'disabled':''}>›</button></span></div><div class="rh">${esc(mn)}${st.cur?' '+T3.live:''}</div>`;
  if(!st.c){box.innerHTML=head+`<div class="muted">${T3.none}</div>`;return;}
  const goalT=st.dim*GOAL,gp=Math.min(100,Math.floor(st.c/goalT*100));
  let h=head;
  h+=`<div class="rn"><div><b>${st.c}</b><span>${T3.total}</span></div><div><b>${st.act}/${st.el}</b><span>${T3.days}</span></div><div><b>${st.best} ${T3.d}</b><span>${T3.streak}</span></div><div><b>%${gp}</b><span>${T3.goal}</span></div></div>`;
  const mx=Math.max(1,...st.daily.map(v=>v||0));
  h+=`<div class="rh">${T3.daily}</div><div class="db">${st.daily.map((v,i)=>v===null?'<i class="f" style="height:3px"></i>':v===0?`<i class="z" title="${i+1}"></i>`:`<i style="height:${Math.max(8,Math.round(v/mx*100))}%" title="${i+1}: ${v}"></i>`).join('')}</div>`;
  if(st.bestN)h+=`<div class="muted">${T3.best}: ${new Date(y,m,st.bestD).toLocaleDateString(T2.loc,{day:'numeric',month:'long'})} • ${st.bestN} ${T3.unit}</div>`;
  // kategoriler
  const cr=[];
  h+=`<div class="rh">${T3.cats}</div>`;
  CATS.forEach(cat=>{
    const li=st.items.filter(i=>i.cat===cat);if(!li.length)return;
    const dn=li.reduce((a,i)=>a+(st.cnt[i.id]||0),0),pos=li.length*st.el,pc=Math.round(dn/pos*100);
    cr.push({cat,pc});
    h+=`<div class="rb"><div class="row"><span>${t.cats[cat]}</span><b>${dn} • %${pc}</b></div><div class="bar"><i style="width:${pc}%"></i></div></div>`;
  });
  if(cr.length>1){
    const hi=cr.reduce((a,b)=>b.pc>a.pc?b:a),lo=cr.reduce((a,b)=>b.pc<a.pc?b:a);
    if(hi.pc!==lo.pc)h+=`<div class="rl">${T3.most.replace('{x}',t.cats[hi.cat])}<br>${T3.least.replace('{x}',t.cats[lo.cat])}</div>`;
  }
  // en çok işaretlenenler / işaretlenmeyenler
  const sorted=st.items.filter(i=>st.cnt[i.id]).sort((a,b)=>st.cnt[b.id]-st.cnt[a.id]).slice(0,3);
  if(sorted.length)h+=`<div class="rh">${T3.top}</div><div class="rl">${sorted.map(i=>`• ${esc(i.n)} — ${st.cnt[i.id]} ${T3.d}`).join('<br>')}</div>`;
  const nv=st.items.filter(i=>!st.cnt[i.id]);
  h+=`<div class="rh">${T3.never}</div><div class="rl">${nv.length?nv.slice(0,5).map(i=>`• ${esc(i.n)}`).join('<br>')+(nv.length>5?`<br>+${nv.length-5}`:''):T3.all}</div>`;
  // geçen ayla karşılaştırma
  const pd=new Date(y,m-1,1),pc2=monthInfo(pd.getFullYear(),pd.getMonth()).c;
  if(pc2>0){const df=st.c-pc2;h+=`<div class="muted">${T3.prev}: ${pc2} ${T3.unit} (${df>0?'+':df<0?'−':'±'}${Math.abs(df)})</div>`;}
  box.innerHTML=h;
}
function t_h(){return T3.h;}

// Günün ayeti: tarihe göre sabit seçilir, metin/meal API'den gelir (alınamazsa kutu gizli kalır)
async function loadAyah(){
  const ed={tr:'tr.yazir',en:'en.sahih',ar:'ar.muyassar'}[LG];
  const n=Math.floor(Date.now()/86400000)%AYAH.length, ref=AYAH[n];
  try{
    const r=await fetch(`https://api.alquran.cloud/v1/ayah/${ref}/editions/quran-uthmani,${ed}`);
    if(!r.ok)throw 0;
    const j=await r.json(), a=j.data[0], b=j.data[1];
    if(!a||!b||!a.text||!b.text)throw 0;
    document.getElementById('ayAr').textContent=a.text;
    document.getElementById('ayTr').textContent=b.text;
    const sn=LG==='ar'?a.surah.name:a.surah.englishName;
    document.getElementById('ayRef').textContent=`${sn} ${ref} • ${t.src}`;
    document.getElementById('ayBox').style.display='';
  }catch(e){}
}

    function updateThemeButton() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }

    // Safari üst/alt çubuğu sayfa zemin rengine uysun
    function updateThemeColor() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        if (bg) meta.setAttribute('content', bg);
    }

    function initTheme() {
        updateThemeButton();
        updateThemeColor();
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeButton();
        updateThemeColor();
    }

function init(){initTheme();applyText();render();loadAyah();loadTreeAyah();tInit();}
document.addEventListener('DOMContentLoaded',init);
</script>
